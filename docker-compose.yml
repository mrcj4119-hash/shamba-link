services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shamba_link
      POSTGRES_USER: shamba
      POSTGRES_PASSWORD: shamba
    ports:
      - "5432:5432"
    volumes:
      - shamba_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamba -d shamba_link"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shamba_postgres:

services:
  - type: web
    name: shamba-link-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @shamba-link/api
    startCommand: npm run db:migrate --workspace @shamba-link/api && npm run start --workspace @shamba-link/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shamba-link-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: PAYMENT_REVIEWER_EMAILS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: shamba-link-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace @shamba-link/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: shamba-link-db
    databaseName: shamba_link
    user: shamba_link
